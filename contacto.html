<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacta con el Equipo de Pokedex</title>
    <link rel="stylesheet" href="configuracion.css">
    <link rel="stylesheet" href="contacto.css">
</head>
<body>

    <header class="barra_anclada">
        <div class="logo">
            <img src="imagenes/lugia.webp" class="img_logo" alt="POKEDEX">
            <h1>POKEDEX</h1>
        </div>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Inicio</a></li>
                <li class="desplegable">
                    <a href="#">Tipos</a>
                    <ul class="submenu">
                        <li><a href="fuego.html" title="Lista de pokemons tipo fuego">Fuego</a></li>
                        <li><a href="agua.html" title="lista de pokemons tipo fuego">Agua</a></li>
                        <li><a href="planta.html" title="lista de pokemons tipo planta">Planta</a></li>
                    </ul>
                </li>
                <li><a href="contacto.html" title="registro de entrenadores pokemon">Registro entrenador</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor_principal">
        <div class="seccion_contacto">
            
            <h2 class="titulo_formulario">Registro de Entrenador</h2>
            
            <form action="#">
                
                <div class="bloque">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" class="input_plano" placeholder="ej: Nicolas serpa" required>
                </div>

                <div class="bloque">
                    <label for="telefono">Telefono:</label>
                    <input type="tel" id="telefono" name="telefono" class="input_plano" placeholder="600 000 000" required>
                </div>

                <div class="bloque">
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad" class="input_plano" placeholder="10" required>
                </div>

                <div class="bloque">
                    <label for="comunidad">Provincia o Comunidad de España:</label>
                    <select name="comunidad" class="comunidades">
                        <option value="" disabled selected>Selecciona tu ubicación</option>
                        <option value="andalucia">Andalucía</option>
                        <option value="aragon">Aragón</option>
                        <option value="asturias">Asturias</option>
                        <option value="baleares">Islas Baleares</option>
                        <option value="canarias">Canarias</option>
                        <option value="cantabria">Cantabria</option>
                        <option value="castilla-la-mancha">Castilla-La Mancha</option>
                        <option value="castilla-y-leon">Castilla y León</option>
                        <option value="cataluna">Cataluña</option>
                        <option value="comunidad-valenciana">Comunidad Valenciana</option>
                        <option value="extremadura">Extremadura</option>
                        <option value="galicia">Galicia</option>
                        <option value="madrid">Madrid</option>
                        <option value="murcia">Murcia</option>
                        <option value="navarra">Navarra</option>
                        <option value="pais-vasco">País Vasco</option>
                        <option value="la-rioja">La Rioja</option>
                        <option value="ceuta">Ceuta</option>
                        <option value="melilla">Melilla</option>
                    </select>
                </div>

                <div class="bloque">
                    <label for="mensaje">Alguna sugerencia para el torneo...</label>
                    <textarea id="mensaje" name="mensaje" class="texto" rows="4" placeholder="Escribe aquí tus comentarios..."></textarea>
                </div>

                <div class="bloque">
                    <label>Tipo de Pokémon Favorito:</label>
                    <div class="opciones_linea">
                        <label><input type="radio" name="tipo_fav" value="psiquico"> Planta</label>
                        <label><input type="radio" name="tipo_fav" value="fuego"> Fuego</label>
                        <label><input type="radio" name="tipo_fav" value="agua"> Agua</label>
                    </div>
                </div>

                <div class="bloque">
                    <label>Selecciona tus Pokémon favoritos (Selección múltiple):</label>
                    <div class="lista_pokemon">
                        
                        <label class="item_poke">
                            <input type="checkbox" name="pokes" value="haunter">
                            <img src="imagenes/Haunter.png" alt="Haunter">
                            <span>Haunter</span>
                        </label>

                        <label class="item_poke">
                            <input type="checkbox" name="pokes" value="pikachu">
                            <img src="imagenes/pikachu.webp" alt="Pikachu">
                            <span>Pikachu</span>
                        </label>

                        <label class="item_poke">
                            <input type="checkbox" name="pokes" value="glaceon">
                            <img src="imagenes/glaceon.webp" alt="Glaceon">
                            <span>Glaceon</span>
                        </label>

                        <label class="item_poke">
                            <input type="checkbox" name="pokes" value="mewtwo">
                            <img src="imagenes/mewtwo.webp" alt="Mewtwo">
                            <span>Mewtwo</span>
                        </label>

                        <label class="item_poke">
                            <input type="checkbox" name="pokes" value="flareon">
                            <img src="imagenes/flareon.webp" alt="Flareon">
                            <span>Flareon</span>
                        </label>

                        <label class="item_poke">
                            <input type="checkbox" name="pokes" value="dragonite">
                            <img src="imagenes/dragonite.webp" alt="Dragonite">
                            <span>Dragonite</span>
                        </label>

                        <label class="item_poke">
                            <input type="checkbox" name="pokes" value="ninetales">
                            <img src="imagenes/ninetales.webp" alt="Ninetales">
                            <span>Ninetales</span>
                        </label>

                        <label class="item_poke">
                            <input type="checkbox" name="pokes" value="abra">
                            <img src="imagenes/abra.webp" alt="Abra">
                            <span>Abra</span>
                        </label>

                        <label class="item_poke">
                            <input type="checkbox" name="pokes" value="zapdos">
                            <img src="imagenes/zapdos.webp" alt="Zapdos">
                            <span>Zapdos</span>
                        </label>

                    </div>
                </div>

                <div class="bloque">
                    <label for="mensaje">¿Te gustaria que agregaramos mas pokemons para seleccionar?</label>
                    <textarea id="mensaje" name="mensaje" class="texto" rows="4" placeholder="Dinos cuales pokemons deberiamos agregar"></textarea>
                </div>

                <div class="bloque_botones">
                    <button type="submit" class="boton_enviar">Enviar Registro</button>
                    <button type="reset" class="boton_limpiar">Limpiar Todo</button>
                </div>

            </form>
        </div>
    </main>

    <footer class="final_pagina">
        <div class="contenido_footer">
            <p>&copy; 2026 Pokedex - Formulario de Registro</p>
        </div>
    </footer>

</body>
</html>
