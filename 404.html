<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Error 404 - Pokedex</title>
    <link rel="stylesheet" href="configuracion.css">
    <style>
        .contenedor-404 {
            text-align: center;
            padding: 100px 20px;
        }
        .contenedor-404 h1 {
            font-size: 80px;
            color: #b347c3; 
            margin: 0;
        }
        .contenedor-404 p {
            font-size: 1.2rem;
            color: #666;
            margin: 20px 0;
        }
        .img-error {
            max-width: 300px;
            margin: 20px auto;
        }
        .boton-retorno {
            display: inline-block;
            background-color: #b347c3;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .boton-retorno:hover {
            background-color: #9234a1;
        }
    </style>
</head>
<body>

    <main class="contenedor_principal">
        <div class="contenedor-404">
            <h1>404</h1>
            <img src="imagenes/Psyduck.png" alt="Psyduck confundido" class="img-error">
            <h2>Parece que Psyduck se ha confundido</h2>
            <p>La página que buscas no existe o ha sido movida a otra ruta de la Pokedex.</p>
            
            <a href="index.html" class="boton-retorno" title="Volver a la página principal de la Pokedex">Regresar al Inicio</a>
        </div>
    </main>

</body>
</html>
